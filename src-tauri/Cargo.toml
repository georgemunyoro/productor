[package]
name = "productor"
version = "0.1.0"
description = "Bespoke workspace manager for coding agents"
authors = ["George Munyoro"]
edition = "2021"

[lib]
name = "productor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "fs"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
base64 = "0.22"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
